<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c4fd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>نظام المدرسة الإلكتروني</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* تصميم: واجهة زرقاء عصرية — لوحة تحكم بشريط جانبي (سطح المكتب) وشريط سفلي (الجوال) */
:root{
  --bg:#f1f5fc;--surface:#ffffff;--surface2:#f6f9ff;--ink:#0b1b3f;--muted:#5a6b8d;--line:#dce5f5;
  --brand:#1c4fd8;--brand2:#2f6bff;--brandink:#ffffff;--soft:#e6eeff;--navy:#071a4a;--navy2:#0d2c7a;
  --ok:#0b8f64;--okbg:#e1f5ec;--warn:#b86e00;--warnbg:#fff2d9;--bad:#cf3434;--badbg:#fde8e8;
  --shadow:0 1px 2px rgba(10,27,63,.06),0 10px 28px rgba(10,27,63,.07);--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08101f;--surface:#0f1a30;--surface2:#13213c;--ink:#e8eefb;--muted:#9bacce;--line:#233456;
  --brand:#5b8cff;--brand2:#7aa2ff;--brandink:#06122e;--soft:#16264a;--navy:#050d1f;--navy2:#0e2561;
  --ok:#3fcf9b;--okbg:#0e2a22;--warn:#f0b24a;--warnbg:#2c2210;--bad:#ff7a7a;--badbg:#341618;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 22%,transparent)}
input[type=checkbox]{width:auto;accent-color:var(--brand)}
textarea{resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;color:var(--muted)}
label.ck{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14.5px}
:focus-visible{outline:2.5px solid var(--brand2);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.sm .ic,.btn.sm .ic{width:17px;height:17px}

/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--brand2);background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--brandink);border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 32%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.bad:hover{background:var(--badbg)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn.wide{width:100%}
.icb{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1.5px solid transparent;background:transparent;color:var(--muted);flex:none}
.icb:hover{background:var(--soft);color:var(--brand)}
.icb.bad:hover{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* بطاقات */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:17px;margin-bottom:12px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fg .full{grid-column:1/-1}
.stat{display:flex;gap:14px;align-items:center}
.stat .si{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--brand);flex:none}
.stat .si .ic{width:23px;height:23px}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13.5px}
.stat.warn .si{background:var(--warnbg);color:var(--warn)}
.stat.bad .si{background:var(--badbg);color:var(--bad)}
.stat.ok .si{background:var(--okbg);color:var(--ok)}
.muted{color:var(--muted)}
.small{font-size:13px}
.bd{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--brand);white-space:nowrap}
.bd.ok{background:var(--okbg);color:var(--ok)}
.bd.warn{background:var(--warnbg);color:var(--warn)}
.bd.bad{background:var(--badbg);color:var(--bad)}
.bd.navy{background:var(--navy);color:#fff}
.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}

/* جداول */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--surface2);text-align:right;font-size:13px;color:var(--muted);padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td.act{white-space:nowrap;text-align:left}
input.mk{width:84px;padding:6px 8px;text-align:center}
.exh{cursor:pointer}
.exh small{display:block;font-weight:500}

/* التطبيق */
.app{min-height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr)}
.side{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#dfe8ff;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand b{display:block;color:#fff;font-size:16px;line-height:1.3}
.brand small{color:#9fb6f0}
.logo{display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#2f6bff,#6ea0ff);color:#fff;font-weight:800;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.side nav{display:flex;flex-direction:column;gap:3px;flex:1}
.side nav a,.sidefoot a,.sidefoot button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:#c9d8fb;font-weight:500;background:none;border:none;width:100%;text-align:right}
.side nav a:hover,.sidefoot a:hover,.sidefoot button:hover{background:rgba(255,255,255,.08);color:#fff}
.side nav a.on{background:#fff;color:var(--navy);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.sidefoot{border-top:1px solid rgba(255,255,255,.12);padding-top:10px;margin-top:10px}
.scrim{display:none}
.main{min-width:0}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line)}
.top h1{font-size:21px;flex:1}
.top .menu{display:none}
.content{padding:22px 24px 40px;max-width:1280px;display:flex;flex-direction:column;gap:18px}
.bnav{display:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .s{flex:1;min-width:180px;position:relative}
.toolbar .s input{padding-right:38px}
.toolbar .s .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.toolbar select{width:auto;min-width:130px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.item .tt{flex:1;min-width:0}
.item .tt b{display:block;overflow-wrap:anywhere}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:99px;background:var(--soft);color:var(--brand);font-weight:700;font-size:13.5px}
.chip button{background:none;border:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:inherit;padding:0}
.chip button:hover{background:rgba(0,0,0,.1)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:7px 12px;font-weight:700;color:var(--muted);border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:none}
.seg button.on.p{background:var(--okbg);color:var(--ok)}
.seg button.on.a{background:var(--badbg);color:var(--bad)}
.seg button.on.l{background:var(--warnbg);color:var(--warn)}
.seg button.on.e{background:var(--soft);color:var(--brand)}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:9px}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{flex:1;min-width:92px;text-align:center;padding:7px 6px;border-radius:9px;background:var(--surface2);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.ladder span.on{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.ladder span.next{border-color:var(--brand2);color:var(--brand);background:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:var(--brandink)}

/* نافذة */
#modal .mback{position:fixed;inset:0;background:rgba(5,12,32,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.mbox{background:var(--surface);color:var(--ink);border-radius:18px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;animation:pop .18s}
.mbox.wide{max-width:900px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:18px}
.mbody{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;background:var(--surface2)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s;max-width:90vw}
#toast div.bad{background:var(--bad)}

/* الصفحة العامة */
.pub{min-height:100vh}
.pubtop{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,env(safe-area-inset-left,0px));z-index:5;color:#fff}
.pubtop .brand{border:none;margin:0;padding:0}
.hero{position:relative;color:#fff;padding:110px 20px 80px;background:radial-gradient(900px 400px at 85% -10%,rgba(110,160,255,.45),transparent 60%),radial-gradient(700px 380px at 5% 110%,rgba(47,107,255,.5),transparent 60%),linear-gradient(160deg,var(--navy),var(--navy2) 70%,#1a47b8);overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.hero .in{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.hero h1{font-size:clamp(32px,6vw,58px);font-weight:800;line-height:1.2}
.hero p{font-size:clamp(16px,2.2vw,20px);color:#cfdcff;max-width:620px;margin:0}
.hero .tag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 14px;border-radius:99px;font-weight:700;font-size:14px}
.hero .btn.pri{background:#fff;color:var(--navy);box-shadow:0 10px 28px rgba(0,0,0,.25)}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}
.pubstats{margin-top:-38px;position:relative;z-index:2}
.pubsec{padding:38px 0 8px}
.pubsec h2{font-size:26px;margin-bottom:14px}
.annc{display:flex;flex-direction:column;gap:8px}
.annc h3{margin:0}
.annc .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.annc p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.foot{margin-top:40px;padding:26px 18px;background:var(--navy);color:#9fb6f0;text-align:center;font-size:14px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 400px at 80% 0,rgba(47,107,255,.35),transparent 60%),linear-gradient(160deg,var(--navy),var(--navy2))}
.login .card{width:100%;max-width:410px;padding:28px;display:flex;flex-direction:column;gap:16px}
.login .hint{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13.5px}

/* مستندات الطباعة */
#printArea{display:none}
.sheet{background:#fff;color:#000;padding:26px 30px;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;font-size:14.5px;line-height:1.8;border:1px solid #cfd6e6;border-radius:6px}
.sheet *{color:#000;border-color:#222}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:14px}
.sheet .sh .nm{text-align:center;flex:1}
.sheet .sh .nm b{display:block;font-size:22px}
.sheet .sh img{width:62px;height:62px;object-fit:contain}
.sheet .lg{width:62px;height:62px;border:2px solid #000;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:26px}
.sheet h2{text-align:center;font-size:21px;margin:8px 0 14px;border:2px solid #000;padding:5px;border-radius:6px}
.sheet h4{margin:14px 0 6px;font-size:15px}
.sheet table{border:1.5px solid #000}
.sheet th,.sheet td{border:1px solid #333;padding:5px 9px;background:none;color:#000;font-size:13.5px}
.sheet th{background:#eceff6}
.sheet .kv td:nth-child(odd){background:#eceff6;font-weight:700;width:17%}
.sheet .sig{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:26px}
.sheet .sig div{border:1.5px solid #000;border-radius:6px;padding:8px 10px;min-height:92px;font-size:13.5px}
.sheet .sig b{display:block;margin-bottom:34px}
.sheet .box{border:1.5px solid #000;border-radius:6px;padding:10px 14px;margin-top:10px}
.sheet p{margin:6px 0}
.pvbody{padding:14px;background:#d9e0ef;overflow:auto}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
  .sheet{border:none;padding:0;border-radius:0}
  .sheet+.sheet{break-before:page}
  .sheet{font-size:13px;line-height:1.55}
  .sheet .sig{break-inside:avoid;margin-top:16px}
  .sheet .sig div{min-height:78px}
  .sheet .sig b{margin-bottom:24px}
  .sheet table,.sheet .box{break-inside:avoid}
  @page{size:A4;margin:13mm}
}

/* استجابة */
@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;right:0;width:285px;max-width:84vw;height:auto;transform:translateX(105%);transition:transform .22s;z-index:90;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(5,12,32,.5);z-index:80}
  .top{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .top .menu{display:inline-grid}
  .top h1{font-size:18px}
  .content{padding:14px 14px 96px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(10,27,63,.08)}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:700;color:var(--muted);background:none;border:none;border-radius:10px}
  .bnav a.on{color:var(--brand);background:var(--soft)}
  .fg,.fg3,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat b{font-size:22px}
  #modal .mback{align-items:flex-end;padding:0}
  .mbox{border-radius:20px 20px 0 0;max-height:94vh;max-width:none}
  .sheet{padding:16px}
  .hero{padding-top:96px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.hide-s{display:none}}

</style>
</head>
<body>
<div id="root"></div><div id="modal"></div><div id="toast"></div><div id="printArea"></div>
<script>
/* قارئ وكاتب ملفات Excel (xlsx) خفيف بدون مكتبات خارجية — يعمل دون اتصال بالإنترنت */
const X=(()=>{
  const te=new TextEncoder(), td=new TextDecoder('utf-8');
  /* ---------- CRC32 ---------- */
  const T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
  const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  /* ---------- ZIP (تخزين بدون ضغط) ---------- */
  function zip(files){
    const parts=[],cd=[];let off=0;
    const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
    for(const f of files){
      const name=te.encode(f.name),data=typeof f.data==='string'?te.encode(f.data):f.data,c=crc(data);
      const lh=new Uint8Array([0x50,0x4b,3,4,20,0,0,8,0,0,0,0,0x21,0,...u32(c),...u32(data.length),...u32(data.length),...u16(name.length),0,0]);
      parts.push(lh,name,data);
      cd.push({name,c,len:data.length,off});
      off+=lh.length+name.length+data.length;
    }
    let cdSize=0;
    for(const e of cd){

function toast(t,k=''){const el=document.createElement('div');el.className=k;el.textContent=t;$('#toast').appendChild(el);setTimeout(()=>el.remove(),3200)}
function modal(html,wide){$('#modal').innerHTML=`<div class="mback" onmousedown="if(event.target===this)closeM()"><div class="mbox ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;document.body.classList.add('noscroll')}
function closeM(){$('#modal').innerHTML='';document.body.classList.remove('noscroll')}
const mHead=t=>`<div class="mhead"><h3>${t}</h3><button class="icb" onclick="closeM()" aria-label="إغلاق">${ic('x')}</button></div>`;
let ASK=null;
function ask(msg,fn,label='تأكيد الحذف'){ASK=fn;modal(`${mHead('تأكيد')}<div class="mbody"><p style="margin:0">${msg}</p></div><div class="mfoot"><button class="btn bad" onclick="const f=ASK;closeM();f&&f()">${label}</button><button class="btn" onclick="closeM()">إلغاء</button></div>`)}
function printDoc(html,title){
  $('#printArea').innerHTML=html;
  modal(`${mHead(esc(title))}<div class="pvbody">${html}</div><div class="mfoot"><button class="btn pri" onclick="window.print()">${ic('print')} طباعة</button><button class="btn" onclick="closeM()">إغلاق</button></div>`,true);
}
const logoHtml=(size=40)=>DB.settings.logo?`<div class="logo" style="width:${size}px;height:${size}px"><img src="${DB.settings.logo}" alt=""></div>`:`<div class="logo" style="width:${size}px;height:${size}px;font-size:${size*.46}px">${esc((DB.settings.schoolName||'م').trim().charAt(0))}</div>`;

/* ---------- الدخول والتوجيه ---------- */
const authed=()=>{try{return sessionStorage.getItem('school_auth')==='1'||localStorage.getItem('school_auth')==='1'}catch(e){return false}};
function doLogin(e){e.preventDefault();const u=$('#lu').value.trim(),p=$('#lp').value;
  if(u===DB.settings.user&&p===DB.settings.pass){try{sessionStorage.setItem('school_auth','1');if($('#lr').checked)localStorage.setItem('school_auth','1')}catch(x){}location.hash='#dash';toast('أهلاً بك في لوحة التحكم')}
  else{$('#lerr').hidden=false}}
function logout(){try{sessionStorage.removeItem('school_auth');localStorage.removeItem('school_auth')}catch(e){}location.hash='#home'}
function go(p){if(location.hash==='#'+p)render();else location.hash='#'+p}
const S={page:'dash',q:'',fc:'',fs:'',lim:80,date:today(),vq:'',vl:'',nq:'',nk:'',g:{c:'',s:'',sub:''},mc:'',ms:''};
const VIEWS={};
const root=()=>$('#root');
function render(){
  const h=(location.hash||'#home').slice(1)||'home';
  document.title=DB.settings.schoolName;
  if(h==='home'){root().innerHTML=viewHome();window.scrollTo(0,0);return}
  if(h==='login'){if(authed()){go('dash');return}root().innerHTML=viewLogin();return}
  if(!authed()){location.hash='#login';return}
  const page=VIEWS[h]?h:'dash';const changed=S.page!==page;S.page=page;
  const st=window.scrollY;
  root().innerHTML=shell(VIEWS[page]());
  window.scrollTo(0,changed?0:st);
}
window.addEventListener('hashchange',()=>{closeM();render()});

/* ---------- الصفحة الرئيسية ---------- */

  <a class="btn sm" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)" href="#${authed()?'dash':'login'}">${ic('user')} لوحة التحكم</a></div>
  <div class="in"><span class="tag">العام الدراسي ${esc(st.year)}</span><h1>${esc(st.schoolName)}</h1><p>${esc(st.slogan)}</p>
  <div class="row"><a class="btn pri" href="#${authed()?'dash':'login'}">${ic('gear')} الدخول إلى لوحة التحكم</a><a class="btn ghost" href="#announcements" onclick="document.getElementById('announcements').scrollIntoView({behavior:'smooth'});return false">${ic('mega')} الإعلانات</a></div></div></section>
  <div class="wrap pubstats"><div class="grid g4">
   ${[['users',DB.students.length,'طالب وطالبة'],['layers',DB.classes.length,'صفوف دراسية'],['grid',DB.sections.length,'شعب'],['award',DB.subjects.length,'مواد دراسية']].map(x=>`<div class="card stat"><div class="si">${ic(x[0])}</div><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('')}</div></div>
  <div class="wrap pubsec"><h2>مقدمة عن المدرسة</h2><div class="grid g2"><div class="card"><p style="margin:0;white-space:pre-wrap">${esc(st.about)}</p></div>
   <div class="card"><h3>معلومات التواصل</h3><div class="list small">
   ${st.principal?`<div class="item">${ic('user')}<div class="tt">مدير/ة المدرسة<b>${esc(st.principal)}</b></div></div>`:''}
   ${st.phone?`<div class="item">${ic('phone')}<div class="tt">الهاتف<b dir="ltr" style="text-align:right">${esc(st.phone)}</b></div></div>`:''}
   ${st.address?`<div class="item">${ic('home')}<div class="tt">العنوان<b>${esc(st.address)}</b></div></div>`:''}
   ${!st.principal&&!st.phone&&!st.address?`<div class="empty">يمكن إضافة بيانات التواصل من لوحة التحكم ← الإعدادات</div>`:''}</div></div></div></div>
  <div class="wrap pubsec" id="announcements"><h2>إعلانات المدرسة</h2><div class="grid g2">${anns.length?anns.map(a=>`<article class="card annc"><div class="meta">${a.imp?'<span class="bd bad">مهم</span>':'<span class="bd">إعلان</span>'}<span>${fd(a.date)}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></article>`).join(''):'<div class="empty" style="grid-column:1/-1">لا توجد إعلانات حالياً</div>'}</div></div>
  <div class="foot">${esc(st.schoolName)} © ${new Date().getFullYear()} — نظام المدرسة الإلكتروني</div></div>`;

function viewLogin(){
  const st=DB.settings;
  return `<div class="login"><form class="card" onsubmit="doLogin(event)"><div class="row" style="gap:12px">${logoHtml(46)}<div><h3 style="margin:0">${esc(st.schoolName)}</h3><span class="muted small">تسجيل دخول الإدارة</span></div></div>
  <label>اسم المستخدم<input id="lu" autocomplete="username" required autofocus></label>
  <label>كلمة المرور<input id="lp" type="password" autocomplete="current-password" required></label>

  <button class="btn pri wide" type="submit">${ic('user')} دخول</button><a class="btn wide" href="#home">${ic('home')} العودة للصفحة الرئيسية</a></form></div>`;

/* ---------- هيكل لوحة التحكم ---------- */
const NAV=[['dash','لوحة المعلومات','grid'],['students','الطلاب','users'],['classes','الصفوف والشعب','layers'],['att','الحضور والغياب','cal'],['viol','المخالفات والعقوبات','alert'],['notes','الملاحظات والسلوك','note'],['grades','سجل العلامات','award'],['msgs','رسائل أولياء الأمور','msg'],['ann','الإعلانات','mega'],['reports','التقارير','chart'],['settings','الإعدادات','gear']];

function openSide(){$('#side').classList.add('open');$('#scrim').classList.add('on')}
function closeSide(){const s=$('#side');if(s){s.classList.remove('open');$('#scrim').classList.remove('on')}}

/* ---------- لوحة المعلومات ---------- */
VIEWS.dash=function(){
  const t=today(),mo=t.slice(0,7),a=DB.att[t]||{};
  const absent=Object.values(a).filter(v=>v==='a').length,late=Object.values(a).filter(v=>v==='l').length;
  const vm=DB.violations.filter(v=>v.date.startsWith(mo)).length,nm=DB.notes.filter(v=>v.date.startsWith(mo)).length;
  const noPhone=DB.students.filter(s=>!(s.phones||[]).length).length;
  const recent=[...DB.violations].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const perClass=DB.classes.map(c=>({n:c.name,c:DB.students.filter(s=>s.cid===c.id).length}));const mx=Math.max(1,...perClass.map(x=>x.c));
  return `<div class="grid g4">
   <div class="card stat"><div class="si">${ic('users')}</div><div><b>${DB.students.length}</b><span>إجمالي الطلاب</span></div></div>
   <div class="card stat bad"><div class="si">${ic('cal')}</div><div><b>${absent}</b><span>غائبون اليوم${late?` · ${late} متأخر`:''}</span></div></div>
   <div class="card stat warn"><div class="si">${ic('alert')}</div><div><b>${vm}</b><span>مخالفات هذا الشهر</span></div></div>
   <div class="card stat ok"><div class="si">${ic('note')}</div><div><b>${nm}</b><span>ملاحظات هذا الشهر</span></div></div></div>
  <div class="card"><h3>إجراءات سريعة</h3><div class="row">
   <button class="btn pri" onclick="stuForm()">${ic('plus')} إضافة طالب</button><button class="btn" onclick="go('att')">${ic('cal')} تسجيل الحضور</button>
   <button class="btn" onclick="violForm()">${ic('alert')} تسجيل مخالفة</button><button class="btn" onclick="noteForm()">${ic('note')} إضافة ملاحظة</button>
   <button class="btn" onclick="go('grades')">${ic('award')} رصد علامات</button><button class="btn" onclick="annForm()">${ic('mega')} إعلان جديد</button></div>
   ${DB.students.length?'':`<div class="empty" style="margin-top:14px">لا يوجد طلاب بعد. ابدأ بـ <a href="#students">استيراد الطلاب من Excel</a> أو أضف طالباً يدوياً. يمكنك أيضاً تجربة النظام ببيانات تجريبية من <a href="#settings">الإعدادات</a>.</div>`}</div>
  <div class="grid g2"><div class="card"><h3>أحدث المخالفات</h3>${recent.length?`<div class="list">${recent.map(v=>{const s=stu(v.sid);return `<div class="item"><div class="tt"><b>${esc(s?.name||'طالب محذوف')}</b><span class="muted small">${esc(v.type)} · ${fd(v.date)}</span></div><span class="bd ${LEVELS[v.level].cls}">${LEVELS[v.level].n}</span></div>`}).join('')}</div>`:'<div class="empty">لا توجد مخالفات مسجلة</div>'}</div>
   <div class="card"><h3>توزيع الطلاب على الصفوف</h3><div class="list">${perClass.map(x=>`<div><div class="row" style="justify-content:space-between"><span>${esc(x.n)}</span><b>${x.c}</b></div><div class="bar"><i style="width:${x.c/mx*100}%"></i></div></div>`).join('')}</div>
   ${noPhone?`<p class="small muted" style="margin:12px 0 0">${noPhone} طالب بلا رقم هاتف لولي الأمر.</p>`:''}</div></div>`;
};

/* ---------- الطلاب ---------- */

  return `<div class="card"><div class="toolbar"><div class="s">${ic('search')}<input id="sq" placeholder="بحث بالاسم أو الهوية أو الهاتف…" value="${esc(S.q)}" oninput="S.q=this.value;S.lim=80;upd('stuBody',stuBody())"></div>
   <select id="sfc" onchange="S.fc=this.value;S.fs='';S.lim=80;go('students')">${opt(DB.classes,S.fc,'كل الصفوف')}</select>
   <select id="sfs" onchange="S.fs=this.value;S.lim=80;upd('stuBody',stuBody())">${secOpts(S.fc,S.fs)}</select>
   <button class="btn pri" onclick="stuForm()">${ic('plus')} طالب</button></div></div>
  <div class="card"><h3>الاستيراد والتصدير (Excel)</h3><div class="row">
   <button class="btn" onclick="$('#fStu').click()">${ic('upload')} استيراد طلاب</button>

   <div class="row" style="margin-top:12px"><label style="flex-direction:row;align-items:center;gap:10px">مقدمة الأرقام الافتراضية
    <select id="ccSel" style="width:auto" onchange="setCountry(this.value)"><option value="970" ${DB.settings.country==='970'?'selected':''}>فلسطين +970</option><option value="972" ${DB.settings.country==='972'?'selected':''}>إسرائيل +972</option><option value="" ${DB.settings.country===''?'selected':''}>بدون إضافة</option></select></label>
   <span class="muted small">يمكن اختيار مقدمة مختلفة لكل رقم عند إضافته، أو كتابة الرقم دولياً (+972…).</span></div></div>
  <div id="stuBody">${stuBody()}</div>`;

function upd(id,html){const e=document.getElementById(id);if(e)e.innerHTML=html}
function setCountry(v){DB.settings.country=v;save();toast('تم تحديث مقدمة الأرقام')}
function stuBody(){
  const list=filterStudents(S.q,S.fc,S.fs),shown=list.slice(0,S.lim);
  if(!DB.students.length)return `<div class="empty">لا يوجد طلاب بعد. استورد ملف Excel أو أضف طالباً.</div>`;
  if(!list.length)return `<div class="empty">لا نتائج مطابقة للبحث</div>`;
  return `<div class="card" style="padding:12px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>${list.length} طالب</b></div>
  <div class="tw"><table><thead><tr><th>#</th><th>الاسم</th><th>الصف / الشعبة</th><th>الهوية</th><th>ولي الأمر</th><th>الهاتف</th><th></th></tr></thead><tbody>
  ${shown.map((s,i)=>`<tr><td>${i+1}</td><td><b>${esc(s.name)}</b></td><td>${esc(stuCls(s))}</td><td>${esc(s.idNo||'')}</td><td>${esc(s.parent||'')}</td>
   <td dir="ltr" style="text-align:right">${(s.phones||[]).map(p=>`<div>${showPhone(p)}</div>`).join('')||'<span class="bd warn">بلا رقم</span>'}</td>
   <td class="act"><button class="icb" title="ملف الطالب" onclick="stuProfile('${s.id}')">${ic('file')}</button><button class="icb" title="تعديل" onclick="stuForm('${s.id}')">${ic('edit')}</button><button class="icb bad" title="حذف" onclick="delStu('${s.id}')">${ic('trash')}</button></td></tr>`).join('')}
  </tbody></table></div>${list.length>shown.length?`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="S.lim+=120;upd('stuBody',stuBody())">عرض المزيد (${list.length-shown.length})</button></div>`:''}</div>`;
}
function phoneRow(v=''){return `<div class="row phrow" style="flex-wrap:nowrap"><input class="ph grow" inputmode="tel" dir="ltr" placeholder="0599123456" value="${esc(v)}"><select class="phcc" style="width:auto;max-width:44%"><option value="">الافتراضي</option><option value="970">فلسطين +970</option><option value="972">إسرائيل +972</option></select><button type="button" class="icb bad" onclick="this.parentElement.remove()" aria-label="حذف الرقم">${ic('x')}</button></div>`}
function stuForm(id){
  const s=id?stu(id):{name:'',cid:S.fc||DB.classes[0]?.id||'',sec:S.fs||'',idNo:'',parent:'',phones:[],note:''};
  if(!id&&s.cid&&!s.sec)s.sec=secsOf(s.cid)[0]?.id||'';
  const ph=(s.phones&&s.phones.length?s.phones:['']).map(p=>phoneRow(p?'+'+p:'')).join('');
  modal(`${mHead(id?'تعديل بيانات الطالب':'إضافة طالب')}<div class="mbody"><div class="fg">
   <label class="full">الاسم الكامل<input id="f_name" value="${esc(s.name)}" autofocus></label>
   <label>الصف<select id="f_c" onchange="pkC('f_')">${opt(DB.classes,s.cid,'اختر الصف')}</select></label>
   <label>الشعبة<select id="f_s">${secOpts(s.cid,s.sec,'اختر الشعبة')}</select></label>
   <label>رقم الهوية<input id="f_id" inputmode="numeric" value="${esc(s.idNo||'')}"></label>
   <label>اسم ولي الأمر<input id="f_par" value="${esc(s.parent||'')}"></label>
   <div class="full"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b class="small muted">أرقام هواتف ولي الأمر</b><button type="button" class="btn sm" onclick="$('#phList').insertAdjacentHTML('beforeend',phoneRow())">${ic('plus')} رقم آخر</button></div><div id="phList" class="list">${ph}</div>
    <div class="small muted" style="margin-top:6px">اكتب الرقم محلياً (059…) وتُضاف المقدمة المختارة تلقائياً، أو اكتبه دولياً (+972…).</div></div>
   <label class="full">ملاحظات<textarea id="f_note" rows="2">${esc(s.note||'')}</textarea></label></div></div>
   <div class="mfoot"><button class="btn pri" onclick="saveStu('${id||''}')">${ic('check')} حفظ</button><button class="btn" onclick="closeM()">إلغاء</button></div>`);
}
function saveStu(id){
  const name=$('#f_name').value.trim();if(!name)return toast('أدخل اسم الطالب','bad');
  const phones=[...new Set($$('.phrow').map(r=>normPhone($('.ph',r).value,$('.phcc',r).value||undefined)).filter(p=>p.length>=8))];
  const o={name,cid:$('#f_c').value,sec:$('#f_s').value,idNo:toEn($('#f_id').value.trim()),parent:$('#f_par').value.trim(),phones,note:$('#f_note').value.trim()};
  if(o.idNo&&DB.students.some(s=>s.idNo===o.idNo&&s.id!==id))return toast('رقم الهوية مسجل لطالب آخر','bad');
  if(id)Object.assign(stu(id),o);else DB.students.push({id:uid(),...o});
  save();closeM();render();toast(id?'تم تحديث بيانات الطالب':'تمت إضافة الطالب');
}
function delStu(id){const s=stu(id);ask(`هل تريد حذف الطالب <b>${esc(s.name)}</b> مع جميع مخالفاته وملاحظاته وعلاماته؟`,()=>{
  DB.students=DB.students.filter(x=>x.id!==id);DB.violations=DB.violations.filter(x=>x.sid!==id);DB.notes=DB.notes.filter(x=>x.sid!==id);
  Object.values(DB.att).forEach(d=>delete d[id]);Object.values(DB.books).forEach(b=>delete b.marks[id]);save();render();toast('تم الحذف')})}

/* ---------- ملف الطالب ---------- */
function stuProfile(id){
  const s=stu(id);if(!s)return;
  const vs=DB.violations.filter(v=>v.sid===id).sort((a,b)=>b.date.localeCompare(a.date)),ns=DB.notes.filter(v=>v.sid===id).sort((a,b)=>b.date.localeCompare(a.date));
  let ab=0,lt=0,ex=0;Object.values(DB.att).forEach(d=>{const v=d[id];if(v==='a')ab++;if(v==='l')lt++;if(v==='e')ex++});
  const gs=studentGrades(id),maxL=Math.max(0,...vs.map(v=>v.level));
  modal(`${mHead('ملف الطالب')}<div class="mbody">
   <div class="row" style="gap:14px"><div class="logo" style="width:54px;height:54px;font-size:24px">${esc(s.name.charAt(0))}</div><div class="grow"><h3 style="margin:0">${esc(s.name)}</h3><span class="muted">${esc(stuCls(s))}${s.idNo?' · هوية '+esc(s.idNo):''}</span></div></div>

/* ---------- استيراد وتصدير الطلاب ---------- */
const STU_HEAD=['الاسم','الصف','الشعبة','رقم الهوية','اسم ولي الأمر','هاتف ولي الأمر','هاتف ولي الأمر 2'];
function classify(h){h=nz(h);if(!h)return null;
  if(/(هاتف|جوال|موبايل|تلفون|phone|mobile)/.test(h))return /(2|ثاني|اخر|اضافي)/.test(h)?'phone2':'phone';
  if(/(ولي|(^| )(اب|والد)( |$))/.test(h))return 'parent';
  if(/(هويه|(^| )id( |$))/.test(h))return 'idNo';
  if(/شعب/.test(h))return 'sec';
  if(/صف/.test(h))return 'cls';
  if(/(اسم|طالب|name)/.test(h))return 'name';
  return null}
function mapCols(rows){
  let hi=rows.findIndex(r=>r.some(c=>classify(c)==='name'));const m={};
  if(hi<0){hi=-1;['name','cls','sec','idNo','parent','phone','phone2'].forEach((k,i)=>m[k]=i)}
  else rows[hi].forEach((c,i)=>{const k=classify(c);if(k&&m[k]===undefined)m[k]=i});
  return{hi,m};
}
const ORD={'1':'اول','2':'ثاني','3':'ثالث','4':'رابع','5':'خامس','6':'سادس','7':'سابع','8':'ثامن','9':'تاسع','10':'عاشر'};
function clsKey(s){let k=nz(s).replace(/^الصف\s*/,'').replace(/^ال/,'').trim();return ORD[k]||k}
function secKey(s){return nz(s).replace(/^شعبه\s*/,'').trim()}
function readFileRows(inp,cb){const f=inp.files[0];inp.value='';if(!f)return;X.read(f).then(cb).catch(e=>toast(e.message||'تعذر قراءة الملف','bad'))}
let PEND=null;
function importStudents(inp){readFileRows(inp,rows=>{
  const{hi,m}=mapCols(rows);const data=rows.slice(hi+1).filter(r=>r.some(c=>String(c||'').trim()));
  const plan=[];
  data.forEach(r=>{const g=k=>m[k]===undefined?'':String(r[m[k]]??'').trim();const name=g('name');if(!name)return;
    plan.push({name,cls:g('cls'),sec:g('sec'),idNo:toEn(g('idNo')),parent:g('parent'),phones:[g('phone'),g('phone2')].filter(Boolean)})});
  if(!plan.length)return toast('لم يتم العثور على أسماء طلاب في الملف','bad');
  const exist=p=>DB.students.find(s=>(p.idNo&&s.idNo===p.idNo)||(!p.idNo&&nz(s.name)===nz(p.name)&&(!p.cls||clsKey(cName(s.cid))===clsKey(p.cls))));
  const upd=plan.filter(exist).length;PEND=plan;
  modal(`${mHead('معاينة الاستيراد')}<div class="mbody"><div class="grid g3"><div class="item"><div class="tt"><b>${plan.length}</b><span class="muted small">صفوف في الملف</span></div></div><div class="item"><div class="tt"><b>${plan.length-upd}</b><span class="muted small">طلاب جدد</span></div></div><div class="item"><div class="tt"><b>${upd}</b><span class="muted small">طلاب موجودون (تحديث)</span></div></div></div>
   <div class="tw"><table><thead><tr><th>الاسم</th><th>الصف</th><th>الشعبة</th><th>الهوية</th><th>ولي الأمر</th><th>الهاتف</th></tr></thead><tbody>${plan.slice(0,6).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cls)}</td><td>${esc(p.sec)}</td><td>${esc(p.idNo)}</td><td>${esc(p.parent)}</td><td dir="ltr" style="text-align:right">${esc(p.phones.join(' / '))}</td></tr>`).join('')}</tbody></table></div>
   <div class="fg"><label>صف افتراضي للأسماء التي بلا صف<select id="imc" onchange="pkC('im');">${opt(DB.classes,'','بدون')}</select></label><label>شعبة افتراضية<select id="ims">${secOpts('','','بدون')}</select></label></div>
   <p class="small muted" style="margin:0">الصفوف والشعب غير الموجودة تُنشأ تلقائياً. الطلاب الموجودون (بنفس الهوية أو الاسم) تُحدَّث بياناتهم دون تكرار.</p></div>
   <div class="mfoot"><button class="btn pri" onclick="applyImport()">${ic('check')} تنفيذ الاستيراد</button><button class="btn" onclick="closeM()">إلغاء</button></div>`,true);
})}
function findClass(name){if(!name)return null;const k=clsKey(name);let c=DB.classes.find(c=>clsKey(c.name)===k);
  if(!c){c={id:uid(),name:/^\d+$/.test(toEn(name).trim())?'الصف '+toEn(name).trim():name.trim()};DB.classes.push(c)}return c}
function findSection(cid,name){if(!cid||!name)return null;const k=secKey(name);let s=secsOf(cid).find(s=>secKey(s.name)===k);if(!s){s={id:uid(),cid,name:name.trim().replace(/^شعبة\s*/,'')};DB.sections.push(s)}return s}
function applyImport(){
  const dc=$('#imc').value,ds=$('#ims').value;let add=0,up=0;
  PEND.forEach(p=>{
    let cid=dc,sec=ds;if(p.cls){const c=findClass(p.cls);cid=c.id;sec=''}
    if(p.sec&&cid){sec=findSection(cid,p.sec).id}
    const phones=p.phones.map(x=>normPhone(x)).filter(x=>x.length>=8);
    const ex=DB.students.find(s=>(p.idNo&&s.idNo===p.idNo)||(!p.idNo&&nz(s.name)===nz(p.name)&&(!p.cls||clsKey(cName(s.cid))===clsKey(p.cls))));
    if(ex){if(cid)ex.cid=cid;if(sec||p.cls)ex.sec=sec||ex.sec;if(p.parent)ex.parent=p.parent;if(p.idNo)ex.idNo=p.idNo;ex.phones=[...new Set([...(ex.phones||[]),...phones])];up++}
    else{DB.students.push({id:uid(),name:p.name,cid,sec,idNo:p.idNo,parent:p.parent,phones:[...new Set(phones)],note:''});add++}
  });
  PEND=null;save();closeM();render();toast(`تمت إضافة ${add} وتحديث ${up} طالب`);
}
function importPhones(inp){readFileRows(inp,rows=>{
  const{hi,m}=mapCols(rows);if(m.phone===undefined&&m.phone2===undefined)return toast('لم أجد عمود أرقام الهواتف. عنوانه مثل: هاتف ولي الأمر','bad');
  if(m.name===undefined&&m.idNo===undefined)return toast('يلزم عمود الاسم أو رقم الهوية لربط الرقم بالطالب','bad');
  let ok=0;const miss=[];
  rows.slice(hi+1).forEach(r=>{const g=k=>m[k]===undefined?'':String(r[m[k]]??'').trim();const name=g('name'),idn=toEn(g('idNo'));if(!name&&!idn)return;
    const ph=[g('phone'),g('phone2')].map(x=>normPhone(x)).filter(x=>x.length>=8);if(!ph.length)return;
    let s=idn&&DB.students.find(x=>x.idNo===idn);
    if(!s&&name){const c=DB.students.filter(x=>nz(x.name)===nz(name));s=c.length===1?c[0]:c.find(x=>g('cls')&&clsKey(cName(x.cid))===clsKey(g('cls')))}
    if(!s){miss.push(name||idn);return}
    if(g('parent')&&!s.parent)s.parent=g('parent');
    s.phones=[...new Set([...(s.phones||[]),...ph])];ok++});
  save();render();
  if(miss.length)modal(`${mHead('نتيجة استيراد الهواتف')}<div class="mbody"><p style="margin:0">تم تحديث <b>${ok}</b> طالب. لم يُعثر على <b>${miss.length}</b> اسم:</p><div class="small muted">${miss.slice(0,25).map(esc).join(' ، ')}${miss.length>25?' …':''}</div></div><div class="mfoot"><button class="btn" onclick="closeM()">إغلاق</button></div>`);
  else toast(`تم تحديث هواتف ${ok} طالب`);
})}
function exportStudents(blank){
  const rows=[STU_HEAD];
  if(!blank)sortedStudents(DB.students).forEach(s=>rows.push([s.name,cName(s.cid),sName(s.sec),s.idNo||'',s.parent||'',showPhone((s.phones||[])[0]),showPhone((s.phones||[])[1])]));
  X.write(blank?'قالب_الطلاب':'سجل_الطلاب',[{name:'الطلاب',rows},{name:'تعليمات',rows:[['تعليمات التعبئة'],['الاسم: مطلوب. الصف والشعبة: تُنشأ تلقائياً إن لم تكن موجودة.'],['الهاتف: يمكن كتابته محلياً (059…) أو دولياً (+972…). تُضاف المقدمة الافتراضية للأرقام المحلية.']]}]);
}

  const cnt={p:0,a:0,l:0,e:0};list.forEach(s=>{if(day[s.id])cnt[day[s.id]]++});
  return `<div class="card"><div class="toolbar"><label style="flex-direction:row;align-items:center;gap:8px">التاريخ<input type="date" id="ad" value="${d}" style="width:auto" onchange="S.date=this.value||today();go('att')"></label>
   <select onchange="S.fc=this.value;S.fs='';go('att')">${opt(DB.classes,S.fc,'كل الصفوف')}</select><select onchange="S.fs=this.value;go('att')">${secOpts(S.fc,S.fs)}</select>
   <button class="btn" onclick="markAll('p')">${ic('check')} الكل حاضر</button><button class="btn" onclick="absentQueue()">${ic('send')} رسائل الغياب</button></div>
   <p class="small muted" style="margin:8px 0 0">${dayName(d)} ${fd(d)}</p></div>
  <div class="grid g4">${Object.entries(ATT).map(([k,[t,c]])=>`<div class="card stat ${c==='ok'?'ok':c==='bad'?'bad':c==='warn'?'warn':''}"><div class="si">${ic(k==='p'?'check':'cal')}</div><div><b>${cnt[k]}</b><span>${t}</span></div></div>`).join('')}</div>
  ${list.length?`<div class="list">${list.map(s=>`<div class="item" style="flex-wrap:wrap"><div class="tt"><b>${esc(s.name)}</b><span class="muted small">${esc(stuCls(s))}</span></div>
   <div class="seg">${Object.entries(ATT).map(([k,[t]])=>`<button class="${k} ${day[s.id]===k?'on':''}" onclick="setAtt('${s.id}','${k}')">${t}</button>`).join('')}</div></div>`).join('')}</div>`:'<div class="empty">لا يوجد طلاب. اختر صفاً وشعبة أو أضف طلاباً أولاً.</div>'}`;
};
function setAtt(sid,v){const d=S.date;DB.att[d]=DB.att[d]||{};if(DB.att[d][sid]===v)delete DB.att[d][sid];else DB.att[d][sid]=v;save();render()}
function markAll(v){const d=S.date;DB.att[d]=DB.att[d]||{};filterStudents('',S.fc,S.fs).forEach(s=>{if(!DB.att[d][s.id])DB.att[d][s.id]=v});save();render()}

/* ================= المخالفات والعقوبات ================= */
const nextLevel=sid=>Math.min(5,Math.max(0,...DB.violations.filter(v=>v.sid===sid).map(v=>v.level))+1);
VIEWS.viol=function(){
  return `<div class="card"><div class="toolbar"><div class="s">${ic('search')}<input placeholder="بحث باسم الطالب أو نوع المخالفة…" value="${esc(S.vq)}" oninput="S.vq=this.value;upd('violBody',violBody())"></div>
   <select style="width:auto" onchange="S.vl=this.value;upd('violBody',violBody())"><option value="">كل المراحل</option>${[1,2,3,4,5].map(l=>`<option value="${l}" ${S.vl==l?'selected':''}>${LEVELS[l].n}</option>`).join('')}</select>
   <button class="btn pri" onclick="violForm()">${ic('plus')} تسجيل مخالفة</button></div>
   <div class="ladder" style="margin-top:14px">${[1,2,3,4,5].map(l=>`<span>${l}. ${LEVELS[l].n}${LEVELS[l].pledge?' + تعهد':''}</span>`).join('')}</div>
   <p class="small muted" style="margin:10px 0 0">تتدرج العقوبة تلقائياً مع كل مخالفة جديدة للطالب، ويمكنك تغيير المرحلة يدوياً. لكل مرحلة نموذج رسمي للطباعة بتوقيع ولي الأمر والطالب.</p></div>
  <div id="violBody">${violBody()}</div>`;
};
function violBody(){
  const q=nz(S.vq||'');
  const list=[...DB.violations].filter(v=>(!S.vl||v.level==S.vl)&&(!q||nz(stu(v.sid)?.name||'').includes(q)||nz(v.type).includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||0);
  if(!list.length)return '<div class="empty">لا توجد مخالفات مسجلة</div>';
  return `<div class="tw"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>المخالفة</th><th>العقوبة</th><th>إشعار ولي الأمر</th><th></th></tr></thead><tbody>${list.slice(0,200).map(v=>{const s=stu(v.sid);return `<tr><td>${fd(v.date)}</td><td><b>${esc(s?.name||'محذوف')}</b><div class="muted small">${s?esc(stuCls(s)):''}</div></td><td>${esc(v.type)}${v.desc?`<div class="muted small">${esc(v.desc)}</div>`:''}</td>
   <td><span class="bd ${LEVELS[v.level].cls}">${LEVELS[v.level].n}</span></td><td>${v.notified?'<span class="bd ok">تم</span>':'<span class="bd">لم يُرسل</span>'}</td>
   <td class="act"><button class="icb" title="طباعة النموذج" onclick="penaltyReport('${v.id}')">${ic('print')}</button><button class="icb" title="إشعار ولي الأمر" onclick="notifyViol('${v.id}')">${ic('send')}</button><button class="icb bad" title="حذف" onclick="delViol('${v.id}')">${ic('trash')}</button></td></tr>`}).join('')}</tbody></table></div>`;
}
function pkHook_v_(){const sid=$('#v_t')?.value;if(!sid)return;const l=nextLevel(sid);$('#vlev').value=l;ladderHint()}
function ladderHint(){const sid=$('#v_t').value;const mx=sid?Math.max(0,...DB.violations.filter(v=>v.sid===sid).map(v=>v.level)):0;const el=$('#vhint');if(el)el.innerHTML=sid?(mx?`آخر إجراء سابق: <b>${LEVELS[mx].n}</b> (${DB.violations.filter(v=>v.sid===sid).length} مخالفة مسجلة)`:'لا مخالفات سابقة لهذا الطالب'):''}
function violForm(sid){
  const s=sid?stu(sid):null;
  modal(`${mHead('تسجيل مخالفة سلوكية')}<div class="mbody">${picker('v_',s?.cid||S.fc||'',s?.sec||S.fs||'',s?.id||'')}
   <div class="fg"><label>نوع المخالفة<select id="vtype" onchange="$('#vcust').hidden=this.value!=='__'">${DB.vtypes.map(t=>`<option>${esc(t.name)}</option>`).join('')}<option value="__">أخرى (اكتبها)…</option></select></label>
   <label>التاريخ<input type="date" id="vdate" value="${today()}"></label>
   <label class="full" id="vcust" hidden>نوع المخالفة<input id="vcustin" placeholder="اكتب نوع المخالفة"></label>
   <label>مرحلة العقوبة<select id="vlev">${[1,2,3,4,5].map(l=>`<option value="${l}">${l}. ${LEVELS[l].n}</option>`).join('')}</select></label>
   <label>مسجّل المخالفة (المعلم/الإدارة)<input id="vby"></label>
   <div class="full small muted" id="vhint"></div>
   <label class="full">تفاصيل المخالفة<textarea id="vdesc" rows="3" placeholder="وصف ما حدث…"></textarea></label></div>
   <label class="ck"><input type="checkbox" id="vnot"> إرسال إشعار لولي الأمر بعد الحفظ (اختياري)</label></div>
   <div class="mfoot"><button class="btn pri" onclick="saveViol()">${ic('check')} حفظ</button><button class="btn" onclick="closeM()">إلغاء</button></div>`,true);
  if(s)pkHook_v_();
}
function saveViol(){
  const sid=$('#v_t').value;if(!sid)return toast('اختر الطالب','bad');
  let type=$('#vtype').value;if(type==='__')type=$('#vcustin').value.trim();if(!type)return toast('حدد نوع المخالفة','bad');
  const v={id:uid(),sid,type,date:$('#vdate').value||today(),level:+$('#vlev').value,desc:$('#vdesc').value.trim(),by:$('#vby').value.trim(),notified:false};
  DB.violations.push(v);save();const n=$('#vnot').checked;closeM();render();toast('تم تسجيل المخالفة: '+LEVELS[v.level].n);
  if(n)notifyViol(v.id);
}
function notifyViol(id){const v=byId(DB.violations,id),s=stu(v.sid);if(!s)return;
  msgModal(s.id,fillTpl(DB.settings.tpl.violation,msgVars(s,{type:v.type,level:LEVELS[v.level].n,text:v.desc?'التفاصيل: '+v.desc+'.':''})),'مخالفة',id)}
function delViol(id){ask('حذف هذه المخالفة من السجل؟',()=>{DB.violations=DB.violations.filter(v=>v.id!==id);save();render()})}

function sheetHead(title){const st=DB.settings;return `<div class="sh">${st.logo?`<img src="${st.logo}" alt="">`:`<div class="lg">${esc(st.schoolName.charAt(0))}</div>`}<div class="nm"><b>${esc(st.schoolName)}</b><span>العام الدراسي ${esc(st.year)}</span></div><div style="min-width:80px;text-align:left;font-size:13px">التاريخ:<br>${fd(today())}</div></div>${title?`<h2>${title}</h2>`:''}`}
function penaltyReport(id){

  const L=LEVELS[v.level],prev=DB.violations.filter(x=>x.sid===s.id&&x.date<=v.date&&x.id!==v.id).sort((a,b)=>a.date.localeCompare(b.date));

  <tr><td>تاريخ المخالفة</td><td>${fd(v.date)}</td><td>مرحلة العقوبة</td><td><b>${v.level} — ${L.n}</b></td></tr><tr><td>نوع المخالفة</td><td colspan="3">${esc(v.type)}</td></tr></table>
  ${v.desc?`<h4>تفاصيل المخالفة</h4><div class="box">${esc(v.desc)}</div>`:''}
  <h4>الإجراء المتخذ</h4><div class="box">${LEVEL_TEXT[v.level]}</div>
  ${prev.length?`<h4>الإجراءات السابقة على الطالب/ة</h4><table><thead><tr><th>التاريخ</th><th>المخالفة</th><th>الإجراء</th></tr></thead><tbody>${prev.map(p=>`<tr><td>${fd(p.date)}</td><td>${esc(p.type)}</td><td>${LEVELS[p.level].n}</td></tr>`).join('')}</tbody></table>`:''}
  ${L.pledge?`<h4>تعهد ولي الأمر</h4><div class="box">${esc(fillTpl(DB.settings.pledge,{student:s.name}))}</div>`:''}
  <div class="sig"><div><b>ولي الأمر: ${esc(s.parent||'................')}</b>التوقيع: ..................</div><div><b>الطالب/ة: ${esc(s.name)}</b>التوقيع: ..................</div><div><b>المعلم / المرشد${v.by?': '+esc(v.by):''}</b>التوقيع: ..................</div><div><b>مدير المدرسة${DB.settings.principal?': '+esc(DB.settings.principal):''}</b>التوقيع والختم: ..................</div></div></div>`;

  return `<div class="card"><div class="toolbar"><div class="s">${ic('search')}<input placeholder="بحث…" value="${esc(S.nq)}" oninput="S.nq=this.value;upd('noteBody',noteBody())"></div>
   <select style="width:auto" onchange="S.nk=this.value;upd('noteBody',noteBody())"><option value="">كل الأنواع</option>${NOTE_KINDS.map(k=>`<option ${S.nk===k?'selected':''}>${k}</option>`).join('')}</select>

function noteBody(){

}
function noteForm(sid){
  const s=sid?stu(sid):null;
  modal(`${mHead('إضافة ملاحظة أو سلوك')}<div class="mbody">${picker('n_',s?.cid||S.fc||'',s?.sec||S.fs||'',s?.id||'')}
   <div class="fg"><label>النوع<select id="nkind">${NOTE_KINDS.map(k=>`<option>${k}</option>`).join('')}</select></label><label>التاريخ<input type="date" id="ndate" value="${today()}"></label>
   <label class="full">نص الملاحظة<textarea id="ntext" rows="3"></textarea></label><label class="full">المسجِّل<input id="nby" placeholder="اسم المعلم (اختياري)"></label></div>
   <label class="ck"><input type="checkbox" id="nnot"> إرسال الملاحظة إلى ولي الأمر بعد الحفظ (اختياري)</label></div>
   <div class="mfoot"><button class="btn pri" onclick="saveNote()">${ic('check')} حفظ</button><button class="btn" onclick="closeM()">إلغاء</button></div>`,true);
}
function saveNote(){
  const sid=$('#n_t').value,text=$('#ntext').value.trim();if(!sid)return toast('اختر الطالب','bad');if(!text)return toast('اكتب نص الملاحظة','bad');
  const n={id:uid(),sid,kind:$('#nkind').value,text,date:$('#ndate').value||today(),by:$('#nby').value.trim(),notified:false};
  DB.notes.push(n);save();const go2=$('#nnot').checked;closeM();render();toast('تم حفظ الملاحظة');if(go2)notifyNote(n.id);
}
function notifyNote(id){const n=byId(DB.notes,id),s=stu(n.sid);if(!s)return;msgModal(s.id,fillTpl(DB.settings.tpl.note,msgVars(s,{kind:n.kind,text:n.text})),'ملاحظة',id)}
function delNote(id){ask('حذف هذه الملاحظة؟',()=>{DB.notes=DB.notes.filter(n=>n.id!==id);save();render()})}

/* ================= سجل العلامات ================= */
function getBook(sec,sub){const k=sec+'|'+sub;if(!DB.books[k]){DB.books[k]={exams:['الامتحان الأول','الامتحان الثاني','الامتحان الثالث','الامتحان الرابع','الامتحان الخامس'].map(n=>({id:uid(),name:n,max:100})),marks:{}};save()}return DB.books[k]}
function subjStats(sid,sec,sub){
  const b=DB.books[sec+'|'+sub];if(!b)return null;let sm=0,sx=0,n=0;const items=[];
  b.exams.forEach(e=>{const v=b.marks[sid]?.[e.id];if(v!==undefined&&v!==''&&v!==null&&!isNaN(v)){sm+=+v;sx+=+e.max;n++;items.push({name:e.name,v:+v,max:+e.max})}});
  return n&&sx?{sum:sm,max:sx,pct:sm/sx*100,n,items}:null;
}
function studentGrades(sid){const s=stu(sid);const out=[];if(s)DB.subjects.forEach(sub=>{const r=subjStats(sid,s.sec,sub.id);if(r)out.push({sub,...r})});return{subjects:out,overall:out.length?round1(out.reduce((a,x)=>a+x.pct,0)/out.length):null}}
const pctTxt=r=>r?round1(r.pct):'—';
VIEWS.grades=function(){
  const g=S.g,ready=g.s&&g.sub;
  let body='<div class="empty">اختر الصف والشعبة والمادة لعرض سجل العلامات</div>';
  if(ready){
    const b=getBook(g.s,g.sub),list=filterStudents('',g.c,g.s);
    body=`<div class="card"><div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="examForm()">${ic('plus')} إضافة امتحان</button>
     <button class="btn" onclick="exportGrades(false)">${ic('download')} تصدير (ممتلئ)</button><button class="btn" onclick="exportGrades(true)">${ic('file')} قالب فارغ</button>
     <button class="btn" onclick="$('#fGr').click()">${ic('upload')} استيراد علامات</button><button class="btn" onclick="printGrades()">${ic('print')} طباعة السجل</button>
     <input type="file" id="fGr" hidden accept=".xlsx,.csv" onchange="importGrades(this)"></div>
     <p class="small muted" style="margin:0 0 10px">اضغط على عنوان أي امتحان لتغيير اسمه أو علامته الكلية أو حذفه. المعدل = مجموع العلامات ÷ مجموع العلامات الكلية × 100 للامتحانات المرصودة.</p>
     ${list.length?`<div class="tw"><table><thead><tr><th>#</th><th>الطالب</th>${b.exams.map(e=>`<th class="exh" onclick="examForm('${e.id}')" title="تعديل الامتحان">${esc(e.name)}<small>من ${e.max}</small></th>`).join('')}<th>المجموع</th><th>المعدل /100</th></tr></thead><tbody>
     ${list.map((s,i)=>`<tr><td>${i+1}</td><td><b>${esc(s.name)}</b></td>${b.exams.map(e=>`<td><input class="mk" type="number" inputmode="decimal" step="any" min="0" max="${e.max}" value="${b.marks[s.id]?.[e.id]??''}" onchange="setMark('${s.id}','${e.id}',this)"></td>`).join('')}${gradeTail(s.id)}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا يوجد طلاب في هذه الشعبة</div>'}</div>`;
  }
  return `<div class="card"><div class="toolbar"><select onchange="S.g={c:this.value,s:'',sub:S.g.sub};go('grades')">${opt(DB.classes,g.c,'اختر الصف')}</select>
   <select onchange="S.g.s=this.value;go('grades')">${secOpts(g.c,g.s,'اختر الشعبة')}</select>
   <select onchange="S.g.sub=this.value;go('grades')">${opt(DB.subjects,g.sub,'اختر المادة')}</select>
   <button class="btn" onclick="subjectForm()">${ic('plus')} مادة</button></div></div>${body}`;
};
function gradeTail(sid){const g=S.g,r=subjStats(sid,g.s,g.sub);return `<td id="sm_${sid}">${r?round1(r.sum)+' / '+r.max:'—'}</td><td id="av_${sid}"><b>${pctTxt(r)}</b></td>`}
function setMark(sid,eid,el){
  const b=getBook(S.g.s,S.g.sub),e=byId(b.exams,eid);let v=el.value.trim();
  if(v===''){if(b.marks[sid])delete b.marks[sid][eid]}
  else{let n=num(v);if(n===null){el.value='';return toast('قيمة غير صحيحة','bad')}
    if(n>e.max){n=+e.max;el.value=n;toast('العلامة لا تتجاوز '+e.max,'bad')}if(n<0){n=0;el.value=0}
    (b.marks[sid]=b.marks[sid]||{})[eid]=n}
  save();const t=document.createElement('tr');t.innerHTML=gradeTail(sid);const row=el.closest('tr');row.querySelector('[id^=sm_]').outerHTML=t.children[0].outerHTML;row.querySelector('[id^=av_]').outerHTML=t.children[1].outerHTML;
}
function examForm(id){
  const b=getBook(S.g.s,S.g.sub),e=id?byId(b.exams,id):{name:'الامتحان '+(b.exams.length+1),max:100};
  modal(`${mHead(id?'تعديل الامتحان':'إضافة امتحان')}<div class="mbody"><div class="fg"><label>اسم الامتحان<input id="ex_n" value="${esc(e.name)}"></label><label>العلامة الكلية (من كم)<input id="ex_m" type="number" inputmode="decimal" min="1" value="${e.max}"></label></div>
   <p class="small muted" style="margin:0">يمكن تسمية الامتحان كما تشاء: امتحان أول، شهري، نهائي، مشاركة…</p></div>
   <div class="mfoot"><button class="btn pri" onclick="saveExam('${id||''}')">${ic('check')} حفظ</button>${id?`<button class="btn bad" onclick="delExam('${id}')">${ic('trash')} حذف الامتحان</button>`:''}<button class="btn" onclick="closeM()">إلغاء</button></div>`);
}
function saveExam(id){const n=$('#ex_n').value.trim(),m=num($('#ex_m').value);if(!n||!m||m<=0)return toast('أدخل الاسم والعلامة الكلية','bad');
  const b=getBook(S.g.s,S.g.sub);if(id){const e=byId(b.exams,id);e.name=n;e.max=m}else b.exams.push({id:uid(),name:n,max:m});save();closeM();render()}
function delExam(id){const b=getBook(S.g.s,S.g.sub);closeM();ask('حذف هذا الامتحان وجميع علاماته؟',()=>{b.exams=b.exams.filter(e=>e.id!==id);Object.values(b.marks).forEach(m=>delete m[id]);save();render()})}
function subjectForm(){modal(`${mHead('إضافة مادة دراسية')}<div class="mbody"><input id="sbn" placeholder="اسم المادة"></div><div class="mfoot"><button class="btn pri" onclick="addSubject()">إضافة</button><button class="btn" onclick="closeM()">إلغاء</button></div>`)}
function addSubject(){const v=$('#sbn').value.trim();if(!v)return;if(DB.subjects.some(s=>nz(s.name)===nz(v)))return toast('المادة موجودة','bad');const s={id:uid(),name:v};DB.subjects.push(s);S.g.sub=s.id;save();closeM();render()}
function gradeRows(b,list,blank){
  const rows=[['الاسم','رقم الهوية',...b.exams.map(e=>e.name),'المجموع','المعدل من 100'],['العلامة الكلية','',...b.exams.map(e=>+e.max),b.exams.reduce((a,e)=>a+ +e.max,0),100]];
  list.forEach(s=>{const r=blank?null:subjStats(s.id,S.g.s,S.g.sub);rows.push([s.name,s.idNo||'',...b.exams.map(e=>blank?'':(b.marks[s.id]?.[e.id]??'')),r?round1(r.sum):'',r?round1(r.pct):''])});
  return rows;
}
function exportGrades(blank){
  const g=S.g,b=getBook(g.s,g.sub),list=filterStudents('',g.c,g.s),sub=byId(DB.subjects,g.sub).name;
  X.write((blank?'قالب_علامات_':'سجل_علامات_')+cName(g.c)+'_'+sName(g.s)+'_'+sub,[{name:sub,rows:gradeRows(b,list,blank)}]);
}
function importGrades(inp){readFileRows(inp,rows=>{
  const g=S.g,b=getBook(g.s,g.sub),list=filterStudents('',g.c,g.s);
  const hi=rows.findIndex(r=>r.length&&(classify(r[0])==='name'||nz(r[0]).includes('اسم')));if(hi<0)return toast('لم أجد صف العناوين (العمود الأول: الاسم)','bad');
  const head=rows[hi],hasMax=rows[hi+1]&&nz(rows[hi+1][0]||'').includes('كلي');
  const cols=[];head.forEach((h,i)=>{if(i<2||!String(h||'').trim())return;if(/(مجموع|معدل)/.test(nz(h)))return;cols.push(i)});
  if(!cols.length)return toast('لا توجد أعمدة امتحانات في الملف','bad');
  const exMap={};cols.forEach(i=>{let e=b.exams.find(x=>nz(x.name)===nz(head[i]));const mx=hasMax?num(rows[hi+1][i]):null;
    if(!e){e={id:uid(),name:String(head[i]).trim(),max:mx||100};b.exams.push(e)}else if(mx)e.max=mx;exMap[i]=e});
  let ok=0,miss=[];
  rows.slice(hi+(hasMax?2:1)).forEach(r=>{const name=String(r[0]||'').trim(),idn=toEn(r[1]||'');if(!name&&!idn)return;
    const s=list.find(x=>(idn&&x.idNo===idn)||nz(x.name)===nz(name));if(!s){miss.push(name||idn);return}
    cols.forEach(i=>{const v=String(r[i]??'').trim();if(v==='')return;const n=num(v);if(n===null)return;(b.marks[s.id]=b.marks[s.id]||{})[exMap[i].id]=Math.min(n,+exMap[i].max)});ok++});
  save();render();toast(`تم استيراد علامات ${ok} طالب${miss.length?` — لم يُعثر على ${miss.length}`:''}`);
})}
function printGrades(){
  const g=S.g,b=getBook(g.s,g.sub),list=filterStudents('',g.c,g.s),sub=byId(DB.subjects,g.sub).name;
  const html=`<div class="sheet">${sheetHead('سجل علامات — '+esc(sub))}<p><b>الصف:</b> ${esc(cName(g.c))} &nbsp; <b>الشعبة:</b> ${esc(sName(g.s))}</p>
   <table><thead><tr><th>#</th><th>اسم الطالب</th>${b.exams.map(e=>`<th>${esc(e.name)}<br>(${e.max})</th>`).join('')}<th>المجموع</th><th>المعدل /100</th></tr></thead><tbody>
   ${list.map((s,i)=>{const r=subjStats(s.id,g.s,g.sub);return `<tr><td>${i+1}</td><td>${esc(s.name)}</td>${b.exams.map(e=>`<td>${b.marks[s.id]?.[e.id]??''}</td>`).join('')}<td>${r?round1(r.sum)+' / '+r.max:''}</td><td><b>${r?round1(r.pct):''}</b></td></tr>`}).join('')}</tbody></table>
   <div class="sig"><div><b>معلم المادة</b>التوقيع: ..................</div><div><b>مدير المدرسة</b>التوقيع والختم: ..................</div></div></div>`;
  printDoc(html,'سجل علامات '+sub);
}
function reportCard(sid){
  const s=stu(sid),gs=studentGrades(sid);let ab=0,lt=0;Object.values(DB.att).forEach(d=>{if(d[sid]==='a')ab++;if(d[sid]==='l')lt++});
  const html=`<div class="sheet">${sheetHead('كشف علامات الطالب')}<table class="kv"><tr><td>الطالب/ة</td><td>${esc(s.name)}</td><td>الصف / الشعبة</td><td>${esc(stuCls(s))}</td></tr><tr><td>رقم الهوية</td><td>${esc(s.idNo||'—')}</td><td>ولي الأمر</td><td>${esc(s.parent||'—')}</td></tr></table>
  <h4>العلامات</h4>${gs.subjects.length?`<table><thead><tr><th>المادة</th><th>العلامات المرصودة</th><th>المجموع</th><th>المعدل /100</th></tr></thead><tbody>${gs.subjects.map(x=>`<tr><td><b>${esc(x.sub.name)}</b></td><td>${x.items.map(i=>`${esc(i.name)}: ${i.v}/${i.max}`).join(' &nbsp;|&nbsp; ')}</td><td>${round1(x.sum)} / ${x.max}</td><td><b>${round1(x.pct)}</b></td></tr>`).join('')}<tr><td colspan="3"><b>المعدل العام من 100</b></td><td><b>${gs.overall}</b></td></tr></tbody></table>`:'<div class="box">لا توجد علامات مرصودة لهذا الطالب</div>'}
  <p>أيام الغياب: <b>${ab}</b> &nbsp; مرات التأخر: <b>${lt}</b> &nbsp; عدد المخالفات: <b>${DB.violations.filter(v=>v.sid===sid).length}</b></p>
  <div class="sig"><div><b>ولي الأمر</b>التوقيع: ..................</div><div><b>مربي الصف</b>التوقيع: ..................</div><div><b>مدير المدرسة</b>التوقيع والختم: ..................</div></div></div>`;
  printDoc(html,'كشف علامات — '+s.name);
}

   <button class="icb" title="تعديل" onclick="annForm('${a.id}')">${ic('edit')}</button><button class="icb bad" title="حذف" onclick="delAnn('${a.id}')">${ic('trash')}</button></div>`).join('')}</div>`:'<div class="empty">لا توجد إعلانات</div>'}`;

function annForm(id){const a=id?byId(DB.ann,id):{title:'',body:'',date:today(),pub:true,imp:false};
  modal(`${mHead(id?'تعديل الإعلان':'إعلان جديد')}<div class="mbody"><label>العنوان<input id="a_t" value="${esc(a.title)}"></label><label>النص<textarea id="a_b" rows="5">${esc(a.body)}</textarea></label>
   <div class="fg"><label>التاريخ<input type="date" id="a_d" value="${a.date}"></label><div><label class="ck" style="margin-top:22px"><input type="checkbox" id="a_p" ${a.pub?'checked':''}> منشور في الصفحة الرئيسية</label><label class="ck"><input type="checkbox" id="a_i" ${a.imp?'checked':''}> إعلان مهم</label></div></div></div>
   <div class="mfoot"><button class="btn pri" onclick="saveAnn('${id||''}')">${ic('check')} حفظ</button><button class="btn" onclick="closeM()">إلغاء</button></div>`)}
function saveAnn(id){const t=$('#a_t').value.trim(),b=$('#a_b').value.trim();if(!t)return toast('اكتب عنوان الإعلان','bad');
  const o={title:t,body:b,date:$('#a_d').value||today(),pub:$('#a_p').checked,imp:$('#a_i').checked};if(id)Object.assign(byId(DB.ann,id),o);else DB.ann.push({id:uid(),...o});save();closeM();render();toast('تم حفظ الإعلان')}
function delAnn(id){ask('حذف هذا الإعلان؟',()=>{DB.ann=DB.ann.filter(a=>a.id!==id);save();render()})}

VIEWS.reports=function(){
  const mo=today().slice(0,8)+'01';
  return `<div class="grid g2">
  <div class="card"><h3>قائمة طلاب صف / شعبة</h3><div class="row"><select id="r1c" onchange="$('#r1s').innerHTML=secOpts(this.value,'')">${opt(DB.classes,'','كل الصفوف')}</select><select id="r1s">${secOpts('','')}</select><button class="btn pri" onclick="repList()">${ic('print')} عرض وطباعة</button></div></div>
  <div class="card"><h3>كشف الغياب والتأخر</h3><div class="row"><input type="date" id="r2a" value="${mo}" style="width:auto"><input type="date" id="r2b" value="${today()}" style="width:auto"><select id="r2c">${opt(DB.classes,'','كل الصفوف')}</select><button class="btn pri" onclick="repAbsence()">${ic('print')} عرض وطباعة</button></div></div>
  <div class="card"><h3>ملخص المخالفات والعقوبات</h3><div class="row"><input type="date" id="r3a" value="${mo}" style="width:auto"><input type="date" id="r3b" value="${today()}" style="width:auto"><button class="btn pri" onclick="repViol()">${ic('print')} عرض وطباعة</button></div></div>

};
function repList(){const c=$('#r1c').value,s=$('#r1s').value,l=filterStudents('',c,s);if(!l.length)return toast('لا يوجد طلاب','bad');
  printDoc(`<div class="sheet">${sheetHead('قائمة الطلاب')}<p><b>الصف:</b> ${c?esc(cName(c)):'الكل'} &nbsp; <b>الشعبة:</b> ${s?esc(sName(s)):'الكل'} &nbsp; <b>العدد:</b> ${l.length}</p><table><thead><tr><th>#</th><th>الاسم</th><th>الصف / الشعبة</th><th>الهوية</th><th>ولي الأمر</th><th>الهاتف</th></tr></thead><tbody>${l.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(stuCls(x))}</td><td>${esc(x.idNo||'')}</td><td>${esc(x.parent||'')}</td><td dir="ltr">${(x.phones||[]).map(showPhone).join(' / ')}</td></tr>`).join('')}</tbody></table></div>`,'قائمة الطلاب')}
function repAbsence(){const a=$('#r2a').value,b=$('#r2b').value,c=$('#r2c').value;const m={};
  Object.entries(DB.att).forEach(([d,day])=>{if(d<a||d>b)return;Object.entries(day).forEach(([sid,v])=>{if(v==='p')return;(m[sid]=m[sid]||{a:0,l:0,e:0})[v]++})});
  const l=sortedStudents(Object.keys(m).map(stu).filter(s=>s&&(!c||s.cid===c)));if(!l.length)return toast('لا يوجد غياب في الفترة المحددة','bad');
  printDoc(`<div class="sheet">${sheetHead('كشف الغياب والتأخر')}<p>من ${fd(a)} إلى ${fd(b)}</p><table><thead><tr><th>#</th><th>الطالب</th><th>الصف / الشعبة</th><th>غياب</th><th>غياب بعذر</th><th>تأخر</th></tr></thead><tbody>${l.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(stuCls(s))}</td><td>${m[s.id].a}</td><td>${m[s.id].e}</td><td>${m[s.id].l}</td></tr>`).join('')}</tbody></table></div>`,'كشف الغياب')}
function repViol(){const a=$('#r3a').value,b=$('#r3b').value;const l=DB.violations.filter(v=>v.date>=a&&v.date<=b).sort((x,y)=>x.date.localeCompare(y.date));if(!l.length)return toast('لا مخالفات في الفترة','bad');
  printDoc(`<div class="sheet">${sheetHead('ملخص المخالفات والعقوبات')}<p>من ${fd(a)} إلى ${fd(b)} — العدد: <b>${l.length}</b></p><table><thead><tr>${[1,2,3,4,5].map(i=>`<th>${LEVELS[i].n}</th>`).join('')}</tr></thead><tbody><tr>${[1,2,3,4,5].map(i=>`<td>${l.filter(v=>v.level===i).length}</td>`).join('')}</tr></tbody></table>
   <h4>التفاصيل</h4><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>الصف</th><th>المخالفة</th><th>العقوبة</th></tr></thead><tbody>${l.map(v=>{const s=stu(v.sid);return `<tr><td>${fd(v.date)}</td><td>${esc(s?.name||'—')}</td><td>${s?esc(stuCls(s)):''}</td><td>${esc(v.type)}</td><td>${LEVELS[v.level].n}</td></tr>`}).join('')}</tbody></table></div>`,'ملخص المخالفات')}
function repGrades(){const c=$('#r4c').value,s=$('#r4s').value;if(!s)return toast('اختر الصف والشعبة','bad');const l=filterStudents('',c,s);if(!l.length)return toast('لا يوجد طلاب','bad');
  const subs=DB.subjects.filter(sb=>l.some(x=>subjStats(x.id,s,sb.id)));if(!subs.length)return toast('لا توجد علامات مرصودة لهذه الشعبة','bad');
  printDoc(`<div class="sheet">${sheetHead('كشف علامات الشعبة (المعدل من 100)')}<p><b>الصف:</b> ${esc(cName(c))} &nbsp; <b>الشعبة:</b> ${esc(sName(s))}</p><table><thead><tr><th>#</th><th>الطالب</th>${subs.map(x=>`<th>${esc(x.name)}</th>`).join('')}<th>المعدل العام</th></tr></thead><tbody>${l.map((x,i)=>{const g=studentGrades(x.id);return `<tr><td>${i+1}</td><td>${esc(x.name)}</td>${subs.map(sb=>{const r=subjStats(x.id,s,sb.id);return `<td>${pctTxt(r)}</td>`}).join('')}<td><b>${g.overall??'—'}</b></td></tr>`}).join('')}</tbody></table></div>`,'كشف علامات الشعبة')}

  <div class="card"><h3>النسخ الاحتياطي والبيانات</h3><p class="muted small" style="margin-top:0">البيانات محفوظة داخل متصفح هذا الجهاز. صدّر نسخة احتياطية بشكل دوري، واستخدمها لنقل البيانات إلى جهاز آخر.</p>
   <div class="row"><button class="btn" onclick="backup()">${ic('download')} تصدير نسخة احتياطية</button><button class="btn" onclick="$('#fRes').click()">${ic('upload')} استعادة نسخة</button><input type="file" id="fRes" hidden accept=".json" onchange="restore(this)">
   <button class="btn" onclick="loadDemo()">تحميل بيانات تجريبية</button><button class="btn bad" onclick="resetAll()">${ic('trash')} مسح كل البيانات</button></div></div>`;
};
function saveSchool(){const st=DB.settings;st.schoolName=$('#s_name').value.trim()||st.schoolName;st.year=$('#s_year').value.trim();st.slogan=$('#s_slogan').value.trim();st.about=$('#s_about').value.trim();st.principal=$('#s_pr').value.trim();st.phone=$('#s_ph').value.trim();st.address=$('#s_ad').value.trim();save();render();toast('تم حفظ بيانات المدرسة')}
function saveMsgSettings(){const st=DB.settings;st.country=$('#s_cc').value;st.channel=$('#s_ch').value;st.tpl.absent=$('#t_a').value;st.tpl.late=$('#t_l').value;st.tpl.violation=$('#t_v').value;st.tpl.note=$('#t_n').value;st.pledge=$('#t_p').value;save();toast('تم الحفظ')}
function saveAccount(){const u=$('#s_user').value.trim(),p=$('#s_pass').value;if(!u)return toast('اسم المستخدم مطلوب','bad');if(p&&p.length<4)return toast('كلمة المرور قصيرة (4 أحرف على الأقل)','bad');DB.settings.user=u;if(p){DB.settings.pass=p;DB.settings.passChanged=true}save();$('#s_pass').value='';toast('تم تحديث بيانات الدخول')}
function setLogo(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);DB.settings.logo=c.toDataURL('image/png');save();render();toast('تم رفع الشعار')};im.src=e.target.result};r.readAsDataURL(f)}
function addListItem(k,inp){const v=$('#'+inp).value.trim();if(!v)return;if(DB[k].some(x=>nz(x.name)===nz(v)))return toast('موجود مسبقاً','bad');DB[k].push({id:uid(),name:v});save();render()}
function delSubject(id){ask('حذف المادة وجميع علاماتها؟',()=>{DB.subjects=DB.subjects.filter(s=>s.id!==id);Object.keys(DB.books).forEach(k=>{if(k.endsWith('|'+id))delete DB.books[k]});if(S.g.sub===id)S.g.sub='';save();render()})}
function delVtype(id){DB.vtypes=DB.vtypes.filter(s=>s.id!==id);save();render()}
function backup(){X.download(new Blob([JSON.stringify(DB)],{type:'application/json'}),'نسخة_احتياطية_'+today()+'.json');toast('تم تصدير النسخة الاحتياطية')}
function restore(inp){const f=inp.files[0];inp.value='';if(!f)return;f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){return toast('الملف غير صالح','bad')}
  if(!Array.isArray(d.classes)||!Array.isArray(d.students))return toast('هذا ليس ملف نسخة احتياطية للنظام','bad');
  ask(`استعادة النسخة (${d.students.length} طالب) ستستبدل البيانات الحالية. متابعة؟`,()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}DB=loadDB();save();render();toast('تمت الاستعادة')},'استعادة')})}
function resetAll(){ask('سيتم مسح جميع البيانات (الطلاب، المخالفات، العلامات، الإعدادات) نهائياً. هل أنت متأكد؟',()=>{DB=defaults();save();render();toast('تم مسح البيانات')},'مسح نهائي')}
function loadDemo(){ask('إضافة 24 طالباً تجريبياً مع مخالفات وملاحظات وعلامات؟ (يمكن حذفها لاحقاً)',()=>{
  const fn=['محمد','أحمد','يوسف','عمر','خالد','سارة','لينا','ريم','هدى','نور','مريم','إبراهيم'],ln=['الخطيب','حداد','النجار','سليمان','عيسى','منصور','عودة','شاهين'];
  const rnd=a=>a[Math.floor(Math.random()*a.length)];let k=0;
  DB.classes.slice(0,3).forEach(c=>{const sec=secsOf(c.id)[0];for(let i=0;i<8;i++){k++;DB.students.push({id:uid(),name:`${rnd(fn)} ${rnd(fn)} ${rnd(ln)}`,cid:c.id,sec:sec.id,idNo:String(400000000+k*7919),parent:`${rnd(fn)} ${rnd(ln)}`,phones:['970599'+String(100000+k*3571).slice(0,6)],note:''})}});
  const t=today(),sx=DB.students;DB.att[t]=DB.att[t]||{};sx.slice(0,10).forEach((s,i)=>{DB.att[t][s.id]=i%5===0?'a':i%7===0?'l':'p'});
  [[0,1],[0,2],[3,1],[9,1],[9,2],[9,3]].forEach(([i,l])=>DB.violations.push({id:uid(),sid:sx[i].id,type:rnd(DB.vtypes).name,date:t,level:l,desc:'',by:'',notified:false}));
  DB.notes.push({id:uid(),sid:sx[1].id,kind:'سلوك إيجابي',text:'مساعدة زملائه في الصف والتعاون مع المعلم',date:t,by:'',notified:false});
  const sec=sx[0].sec,sub=DB.subjects[3].id,b=getBook(sec,sub);sx.filter(s=>s.sec===sec).forEach(s=>{b.exams.slice(0,3).forEach(e=>{(b.marks[s.id]=b.marks[s.id]||{})[e.id]=Math.round(55+Math.random()*45)})});
  save();render();toast('تم تحميل البيانات التجريبية')},'تحميل')}

/* ================= التشغيل ================= */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();

</script>
